# 主题
include current-theme.conf

# 字体与字号
font_family      family='Cascadia Mono NF' style=SemiLight variable_name=CascadiaMonoNFRoman
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.5

# 行高
# adjust_line_height                   1

# 单实例模式
# single-instance                      yes

# 光标
cursor_shape                           block
cursor_blink_interval                  0
# shell_integration                    no-cursor
cursor_trail                           1
cursor_trail_start_threshold           2
cursor_trail_decay                     0.1 0.2
# custom_shaders                       cursor-trail-blaze
custom_shaders                         cursor-trail-motion-blur
# custom_shaders                       super-trail

# 窗口
remember_window_size                   no
initial_window_width                   130c
initial_window_height                  40c
# hide_window_decorations              no
# window_margin_width                  0
# window_padding_width                 0
# background_opacity                   0.9
# background_blur                      30
placement_strategy                     top

# tab bar
tab_bar_edge                           bottom
tab_bar_style                          powerline

# 自定义快捷键
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+t new_tab

